<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Sensor Dashboard</title>

        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

        <style>
            body {
                font-family: Arial, sans-serif;
                background: #f4f6f8;
                padding: 40px;
            }

            h1 {
                color: #222;
            }

            .sensor-card {
                background: white;
                padding: 20px;
                margin-bottom: 15px;
                border-radius: 10px;
                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            }

            .sensor-card-warning {
                border-left: 6px solid darkred;
            }

            .sensor-name {
                font-size: 20px;
                font-weight: bold;
            }

            .sensor-value {
                font-size: 28px;
                margin-top: 10px;
            }

            .sensor-time {
                margin-top: 5px;
                font-size: 13px;
                color: #666;
            }

            .sensor-status {
                margin-top: 10px;
                font-weight: bold;
            }

            .status-ok {
                color: green;
            }

            .status-warning {
                color: darkred;
            }

            .sensor-stats {
                margin-top: 12px;
                font-size: 14px;
                color: #333;
                display: flex;
                gap: 15px;
                flex-wrap: wrap;
            }

            .chart-container {
                margin-top: 15px;
                height: 220px;
            }

            .sensor-history {
                margin-top: 12px;
                font-size: 14px;
                color: #555;
            }

            .controls {
                margin-bottom: 20px;
                display: flex;
                align-items: center;
                gap: 10px;
            }

                .controls label {
                    font-weight: bold;
                }

                .controls select {
                    padding: 8px 12px;
                    border-radius: 6px;
                    border: 1px solid #ccc;
                    font-size: 14px;
                }

            .error {
                color: darkred;
                background: #ffe0e0;
                padding: 15px;
                border-radius: 8px;
            }
        </style>
    </head>

    <body>
        <h1>Sensor Dashboard</h1>

        <div class="controls">
            <label for="sensor-select">View:</label>

            <select id="sensor-select">
                <option value="all">All Sensors</option>
                <option value="Temperature">Temperature</option>
                <option value="Humidity">Humidity</option>
                <option value="Voltage">Voltage</option>
            </select>
        </div>

        <div id="sensor-container">
            Loading sensors...
        </div>

        <script>
            const charts = {};

            function formatNumber(value) {
                const number = Number(value);

                if (Number.isNaN(number)) {
                    return "N/A";
                }

                return number.toFixed(2);
            }

            function renderSensorChart(sensor, chartId) {
                const canvas = document.getElementById(chartId);

                if (!canvas) {
                    return;
                }

                if (charts[chartId]) {
                    charts[chartId].destroy();
                }

                const labels = sensor.history.map(reading => {
                    return reading.timestamp.split(" ")[1];
                });

                const values = sensor.history.map(reading => reading.value);

                charts[chartId] = new Chart(canvas, {
                    type: "line",
                    data: {
                        labels: labels,
                        datasets: [
                            {
                                label: `${sensor.name} (${sensor.unit})`,
                                data: values,
                                tension: 0.3
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        animation: false,
                        scales: {
                            y: {
                                beginAtZero: false
                            }
                        }
                    }
                });
            }

            async function loadSensors() {
                try {
                const selectedSensor = document.getElementById("sensor-select").value;

                let url = "http://localhost:8080/sensors";

                if (selectedSensor !== "all") {
                    url = `http://localhost:8080/sensors/${selectedSensor}`;
                }

                const response = await fetch(url);

                if (!response.ok) {
                    throw new Error("Backend returned an error");
                }

                const data = await response.json();
                const sensors = data.sensors ? data.sensors : [data];

                const container = document.getElementById("sensor-container");
                container.innerHTML = "";

            sensors.forEach(sensor => {
                const card = document.createElement("div");
                card.className = "sensor-card";

                if (sensor.status !== "OK") {
                    card.classList.add("sensor-card-warning");
                }

                const statusClass = sensor.status === "OK" ? "status-ok" : "status-warning";

                const historyText = sensor.history
                    .map(reading => `${formatNumber(reading.value)} ${sensor.unit} at ${reading.timestamp}`)
                    .join("<br>");

                const chartId = `chart-${sensor.name}`;

                card.innerHTML = `
                    <div class="sensor-name">${sensor.name}</div>
                    <div class="sensor-value">${formatNumber(sensor.value)} ${sensor.unit}</div>
                    <div class="sensor-time">Last updated: ${sensor.timestamp}</div>
                    <div class="sensor-status ${statusClass}">Status: ${sensor.status}</div>

                    <div class="sensor-stats">
                        <div>Min: ${formatNumber(sensor.min)} ${sensor.unit}</div>
                        <div>Max: ${formatNumber(sensor.max)} ${sensor.unit}</div>
                        <div>Avg: ${formatNumber(sensor.average)} ${sensor.unit}</div>
                    </div>

                    <div class="chart-container">
                        <canvas id="${chartId}"></canvas>
                    </div>

                    <div class="sensor-history">
                        <strong>Recent readings:</strong><br>
                        ${historyText}
                    </div>
                    `;

                    container.appendChild(card);

                    renderSensorChart(sensor, chartId);
                });
            } catch (error) {
                const container = document.getElementById("sensor-container");

                    container.innerHTML = `
                        <div class="error">
                            Could not connect to the C++ backend.
                            Make sure the backend is running on port 8080.
                        </div>
                    `;
                }
            }

            document.getElementById("sensor-select").addEventListener("change", loadSensors);

            loadSensors();

            setInterval(loadSensors, 2000);
        </script>
    </body>
</html>
